<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | bangjeje.dev Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/studio.css">
</head>
<body class="min-h-screen bg-[#F1F5F9] flex items-center justify-center p-6 font-['Outfit'] text-slate-900 relative overflow-hidden">
    
    <!-- Editorial ambient decor -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-[#C3FF00]/15 blur-[100px] rounded-full pointer-events-none"></div>

    <div class="max-w-md w-full relative z-10">
        <!-- Brand header -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center gap-2.5 text-2xl font-bold tracking-tight text-slate-900">
                <div class="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center shadow-md">
                    <div class="w-2.5 h-2.5 bg-[#C3FF00] rounded-full"></div>
                </div>
                bangjeje<span class="text-slate-400 font-light">.dev</span> Studio
            </a>
            <p class="text-[11px] font-mono text-slate-500 uppercase tracking-widest mt-2">Internal Operating Platform</p>
        </div>

        <!-- Card -->
        <div class="studio-panel p-8 md:p-10 bg-white border border-slate-200/80 shadow-2xl rounded-2xl">
            <h2 class="text-xl font-bold text-slate-900 mb-1.5">Executive Sign In</h2>
            <p class="text-slate-500 text-xs font-normal mb-8">Enter your credentials to access the internal OS.</p>

            <form action="dashboard.html" method="get" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-widest text-slate-600 mb-2">Admin Email</label>
                    <div class="relative">
                        <i class="ph ph-envelope text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                        <input type="email" required placeholder="jajang@bangjeje.dev" class="studio-input pl-12 text-sm w-full">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-widest text-slate-600">Secure Key / Password</label>
                        <a href="#" class="text-xs text-slate-900 hover:underline font-medium">Reset Key?</a>
                    </div>
                    <div class="relative">
                        <i class="ph ph-lock-key text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                        <input type="password" required placeholder="••••••••••••••••" class="studio-input pl-12 text-sm w-full">
                    </div>
                </div>

                <div class="flex items-center pt-2">
                    <input type="checkbox" id="remember" class="rounded border-slate-300 text-slate-900 focus:ring-slate-900 h-4 w-4">
                    <label for="remember" class="ml-2.5 text-xs font-normal text-slate-600">Keep session active for 30 days</label>
                </div>

                <button type="submit" class="btn-studio-primary w-full py-4 text-xs font-bold uppercase tracking-widest flex items-center justify-center gap-2 mt-8 text-white">
                    Access Studio OS <i class="ph ph-arrow-right text-base text-[#C3FF00]"></i>
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 font-normal mt-8">
            Return to <a href="../index.html" class="text-slate-700 hover:underline font-medium">bangjeje.dev public website</a>
        </p>
    </div>
</body>
</html>
