<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Taxonomy | bangjeje.dev Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/studio.css">
    <script src="../assets/js/studio-components.js" defer></script>
    <script src="../assets/js/studio.js" defer></script>
</head>
<body class="min-h-screen bg-[#F1F5F9] text-slate-900 font-['Outfit'] flex overflow-x-hidden antialiased">
    <studio-sidebar active="taxonomy"></studio-sidebar>

    <div class="flex-1 lg:pl-64 flex flex-col min-h-screen">
        <studio-header title="Categories & Tags Taxonomy Engine" breadcrumb="Content"></studio-header>


        <main class="flex-1 p-6 lg:p-10 max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="studio-card bg-white p-8 space-y-6 border border-slate-200">
                <div class="flex justify-between items-center border-b pb-4"><h3 class="font-bold text-lg text-slate-900">Categories (25 Active)</h3><button class="px-3 py-1 bg-slate-900 text-[#C3FF00] rounded font-bold text-xs">+ Add Category</button></div>
                <ul class="space-y-3 text-sm font-semibold text-slate-800">
                    <li class="p-3 rounded-xl bg-slate-50 flex justify-between items-center border border-slate-100"><span>Website Templates</span><span class="text-xs text-slate-400 font-mono">Digital Assets (8 items)</span></li>
                    <li class="p-3 rounded-xl bg-slate-50 flex justify-between items-center border border-slate-100"><span>UX Strategy</span><span class="text-xs text-slate-400 font-mono">Articles (6 items)</span></li>
                    <li class="p-3 rounded-xl bg-slate-50 flex justify-between items-center border border-slate-100"><span>Enterprise Fashion Tech</span><span class="text-xs text-slate-400 font-mono">Case Studies (COTIT)</span></li>
                </ul>
            </div>

            <div class="studio-card bg-white p-8 space-y-6 border border-slate-200">
                <div class="flex justify-between items-center border-b pb-4"><h3 class="font-bold text-lg text-slate-900">Global Tags (142 Active)</h3><button class="px-3 py-1 bg-slate-900 text-[#C3FF00] rounded font-bold text-xs">+ Add Tag</button></div>
                <div class="flex flex-wrap gap-2 text-xs font-mono">
                    <span class="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700">#GlassmorphicUI</span>
                    <span class="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700">#TailwindCSS</span>
                    <span class="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700">#HeadlessERP</span>
                    <span class="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700">#VanillaCSS</span>
                    <span class="px-3 py-1.5 bg-slate-100 rounded-lg text-slate-700">#FigmaTokens</span>
                </div>
            </div>
        </main>
        <footer class="mt-auto h-16 border-t bg-white flex items-center justify-between px-6 text-xs text-slate-500"><p>&copy; 2026 bangjeje.dev Studio.</p></footer>
    </div>
    <script src="../assets/js/studio.js"></script>
</body>
</html>
