<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Configuration & Integrations | bangjeje.dev Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/studio.css">
    <script src="../assets/js/studio-components.js" defer></script>
    <script src="../assets/js/studio.js" defer></script>
</head>
<body class="min-h-screen bg-[#F1F5F9] text-slate-900 font-['Outfit'] flex overflow-x-hidden antialiased">
    <studio-sidebar active="settings"></studio-sidebar>

    <div class="flex-1 lg:pl-64 flex flex-col min-h-screen">
        <studio-header title="Website Settings & Integrations" breadcrumb="System"></studio-header>


        <main class="flex-1 p-6 lg:p-10 max-w-6xl w-full mx-auto space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- SEO & Contact -->
                <div class="studio-panel p-8 bg-white border border-slate-200 rounded-2xl space-y-5 shadow-sm">
                    <h3 class="text-sm font-bold uppercase text-slate-900 border-b pb-3 flex items-center gap-2"><i class="ph ph-globe text-lg text-slate-700"></i> Global SEO & Contact Details</h3>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Site Meta Title</label><input type="text" value="bangjeje.dev | Advanced Editorial Web Architecture" class="studio-input text-sm font-bold"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Contact Email</label><input type="email" value="contact@bangjeje.dev" class="studio-input text-sm font-mono"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">HubSpot Embedded Form Portal ID</label><input type="text" value="245789760 (Verified Live)" readonly class="studio-input text-sm font-mono bg-slate-50 text-green-700 font-bold"></div>
                </div>

                <!-- Telemetry & Analytics Scripts -->
                <div class="studio-panel p-8 bg-gradient-to-b from-white to-slate-50 border border-slate-200 rounded-2xl space-y-5 shadow-sm">
                    <h3 class="text-sm font-bold uppercase text-slate-900 border-b pb-3 flex items-center gap-2"><i class="ph ph-chart-bar text-lg text-blue-600"></i> Analytics & Telemetry Integrations</h3>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Google Analytics (GA4) Measurement ID</label><input type="text" placeholder="G-XXXXXXXXXX" class="studio-input font-mono text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Google Search Console Verification Key</label><input type="text" placeholder="meta-tag-verification-string" class="studio-input font-mono text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-600 mb-1">Microsoft Clarity Project ID</label><input type="text" placeholder="clarity-project-id" class="studio-input font-mono text-sm"></div>
                </div>

            </div>
        </main>
        <footer class="mt-auto h-16 border-t bg-white flex items-center justify-between px-6 text-xs text-slate-500"><p>&copy; 2026 bangjeje.dev Studio.</p></footer>
    </div>
    <script src="../assets/js/studio.js"></script>
</body>
</html>
