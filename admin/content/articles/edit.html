<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Workspace MVP &bull; Studio V2 Tiptap Engine</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/studio.css">
    <style>
        /* Tiptap Notion / Ghost Editorial Typography Styling for TailAdmin White Theme */
        .tiptap-empty-node::before {
            content: attr(data-placeholder);
            float: left;
            color: #94a3b8;
            pointer-events: none;
            height: 0;
            font-style: italic;
        }
        #tiptap-canvas-root .ProseMirror h1 { font-size: 2.25rem; font-weight: 800; line-height: 1.2; color: #0f172a; margin-top: 2rem; margin-bottom: 0.75rem; font-family: 'Outfit', sans-serif; letter-spacing: -0.025em; }
        #tiptap-canvas-root .ProseMirror h2 { font-size: 1.75rem; font-weight: 800; line-height: 1.25; color: #0f172a; margin-top: 1.75rem; margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif; letter-spacing: -0.015em; }
        #tiptap-canvas-root .ProseMirror h3 { font-size: 1.25rem; font-weight: 700; line-height: 1.4; color: #1e293b; margin-top: 1.5rem; margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif; }
        #tiptap-canvas-root .ProseMirror p { margin-bottom: 1rem; color: #334155; line-height: 1.75; font-size: 1.125rem; }
        #tiptap-canvas-root .ProseMirror ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.75rem; margin-bottom: 0.75rem; space-y: 0.5rem; }
        #tiptap-canvas-root .ProseMirror ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.75rem; margin-bottom: 0.75rem; space-y: 0.5rem; }
        #tiptap-canvas-root .ProseMirror li { margin-bottom: 0.375rem; color: #1e293b; }
        #tiptap-canvas-root .ProseMirror blockquote { padding-left: 1.25rem; border-left: 4px solid #0f172a; margin-top: 1.5rem; margin-bottom: 1.5rem; font-style: italic; font-family: Georgia, serif; font-size: 1.25rem; color: #1e293b; }
        #tiptap-canvas-root .ProseMirror pre { background-color: #0f172a; color: #34d399; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; padding: 1.25rem; border-radius: 0.75rem; margin-top: 1.25rem; margin-bottom: 1.25rem; overflow-x: auto; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
        #tiptap-canvas-root .ProseMirror code { background-color: #f1f5f9; color: #e11d48; font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; font-weight: 700; padding: 0.125rem 0.375rem; border-radius: 0.25rem; border: 1px solid #e2e8f0; }
        #tiptap-canvas-root .ProseMirror pre code { background-color: transparent; color: inherit; font-size: inherit; font-weight: inherit; padding: 0; border: none; }
        #tiptap-canvas-root .ProseMirror hr { margin-top: 2rem; margin-bottom: 2rem; border-top-width: 2px; border-color: #e2e8f0; }
    </style>
</head>
<body class="bg-white font-['Outfit'] text-slate-900 selection:bg-[#C3FF00]/40 selection:text-slate-900 antialiased overflow-hidden">
    <div class="h-screen flex flex-col bg-white">
        
        <!-- STUDIO V2 CLEAN EDITORIAL TOP BAR (Sprint 1 MVP) -->
        <header class="h-16 border-b border-slate-200 px-6 flex items-center justify-between bg-white z-30 shrink-0">
            <div class="flex items-center gap-4">
                <a href="index.html" class="inline-flex items-center justify-center w-9 h-9 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-100 transition-colors border border-slate-200" title="Return to Articles Vault">
                    <i class="ph ph-arrow-left text-lg font-bold"></i>
                </a>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#C3FF00] inline-block border border-slate-900/10 shadow-2xs"></span>
                    <span class="font-extrabold text-slate-900 text-sm tracking-tight font-sans">Studio V2 Editorial Engine</span>
                    <span class="px-2 py-0.5 rounded-md bg-slate-900 text-[#C3FF00] font-mono text-[10px] font-black uppercase tracking-wider ml-1">Tiptap MVP</span>
                </div>
            </div>

            <!-- Central Formatting Toolbar & History -->
            <div class="hidden md:flex items-center gap-1 bg-slate-50 border border-slate-200 p-1.5 rounded-xl text-xs font-semibold text-slate-700 shadow-2xs">
                <!-- History -->
                <div class="flex items-center gap-0.5 pr-2 border-r border-slate-200">
                    <button id="tb-undo" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs text-slate-600 disabled:opacity-30 transition-all" title="Undo (Ctrl+Z)"><i class="ph ph-arrow-u-up-left text-base"></i></button>
                    <button id="tb-redo" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs text-slate-600 disabled:opacity-30 transition-all" title="Redo (Ctrl+Y)"><i class="ph ph-arrow-u-up-right text-base"></i></button>
                </div>

                <!-- Typography Marks -->
                <div class="flex items-center gap-0.5 px-2 border-r border-slate-200">
                    <button id="tb-bold" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs font-extrabold transition-all" title="Bold (Ctrl+B)">B</button>
                    <button id="tb-italic" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs italic font-bold transition-all" title="Italic (Ctrl+I)">I</button>
                    <button id="tb-strike" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs line-through transition-all" title="Strikethrough">S</button>
                </div>

                <!-- Heading Hierarchy -->
                <div class="flex items-center gap-0.5 px-2 border-r border-slate-200 font-mono font-extrabold">
                    <button id="tb-h1" class="px-2 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Heading 1">H1</button>
                    <button id="tb-h2" class="px-2 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Heading 2">H2</button>
                    <button id="tb-h3" class="px-2 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Heading 3">H3</button>
                </div>

                <!-- Lists & Blocks -->
                <div class="flex items-center gap-0.5 pl-2">
                    <button id="tb-bullet" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Bullet List"><i class="ph ph-list-bullets text-base"></i></button>
                    <button id="tb-ordered" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Numbered List"><i class="ph ph-list-numbers text-base"></i></button>
                    <button id="tb-quote" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Blockquote"><i class="ph ph-quotes text-base"></i></button>
                    <button id="tb-code" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs transition-all" title="Code Block"><i class="ph ph-code text-base"></i></button>
                    <button id="tb-clear" class="w-7 h-7 inline-flex items-center justify-center rounded-lg hover:bg-white hover:shadow-2xs text-rose-500 transition-all ml-1" title="Clear Formatting"><i class="ph ph-eraser text-base"></i></button>
                </div>
            </div>

            <!-- Right Actions & Draft Status (Sprint 1 MVP ONLY) -->
            <div class="flex items-center gap-4 text-xs font-semibold">
                <span id="reading-word-meter" class="text-slate-400 font-mono text-xs hidden lg:inline-block">168 Words | 1m Read</span>
                <span id="draft-status-badge" class="px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-mono text-[10px] font-extrabold uppercase">Draft Saved Locally</span>
                <button id="btn-save-draft" class="btn-studio-primary h-10 px-6 bg-slate-900 text-[#C3FF00] hover:bg-slate-800 hover:text-white text-xs font-black tracking-wider uppercase shadow-md transition-all">
                    <i class="ph ph-floppy-disk text-base mr-2"></i> Save Draft
                </button>
            </div>
        </header>

        <!-- CENTER WRITING WORKSPACE (Zero-Clutter Studio V2 Foundation) -->
        <main class="flex-1 overflow-y-auto p-6 sm:p-12 lg:p-20 bg-white no-scrollbar">
            <div class="max-w-3xl mx-auto space-y-6">
                
                <!-- DOCUMENT TITLE H1 INPUT -->
                <div class="pb-6 border-b border-slate-100">
                    <input type="text" 
                           id="doc-title-input" 
                           placeholder="Untitled Article..." 
                           value="Why Simplicity & Speed Always Win: Building Studio V2 with Tiptap" 
                           class="w-full text-3xl sm:text-5xl font-black text-slate-900 placeholder:text-slate-300 focus:outline-none font-sans tracking-tight leading-tight bg-transparent border-0 p-0">
                </div>

                <!-- TIPTAP PROSEMIRROR AUTHORING CANVAS -->
                <div id="tiptap-canvas-root" class="w-full text-slate-800 font-sans">
                    <!-- Tiptap initializes directly inside this DOM root -->
                </div>

            </div>
        </main>

        <!-- SPRINT 1 MINIMAL TELEMETRY BAR -->
        <footer class="h-8 border-t border-slate-200 px-6 flex items-center justify-between text-[11px] font-mono text-slate-400 shrink-0 bg-slate-50/70">
            <div class="flex items-center gap-4">
                <span>⚡ Type <strong class="text-slate-700 font-bold">/</strong> for instant block commands</span>
                <span>💾 Shortcut <strong class="text-slate-700 font-bold">Ctrl + S</strong> to Save Draft</span>
            </div>
            <div><span>bangjeje.dev Studio V2 &bull; Sprint 1 MVP Foundation</span></div>
        </footer>

    </div>

    <!-- Toast Notification Support -->
    <script src="../../assets/js/studio-components.js"></script>
    <!-- Studio V2 Vanilla Tiptap Editorial Engine (ES Module) -->
    <script type="module" src="../../assets/js/tiptap-editor.js"></script>
</body>
</html>
