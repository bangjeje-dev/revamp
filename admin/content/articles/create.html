<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Article &bull; Editorial Workspace OS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/studio.css">
</head>
<body class="bg-white font-['Outfit'] text-slate-900 selection:bg-[#C3FF00]/40 selection:text-slate-900 antialiased">
    <div class="min-h-screen flex flex-col bg-white">
        
        <!-- EDITORIAL TELEMETRY ACTION BAR (Low Profile) -->
        <header class="editorial-telemetry-bar h-14 border-b border-slate-100 px-6 flex items-center justify-between sticky top-0 bg-white/95 backdrop-blur-xs z-30 shrink-0">
            <div class="flex items-center gap-4 text-xs font-semibold">
                <a href="index.html" class="inline-flex items-center gap-1.5 text-slate-500 hover:text-slate-900 transition-colors">
                    <i class="ph ph-arrow-left text-base"></i> <span>Studio Repository</span>
                </a>
                <span class="text-slate-300">|</span>
                <span id="vault-sync-status" class="inline-flex items-center font-mono text-slate-600 text-xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1.5"></span> Vault Synced
                </span>
                <span class="text-slate-300">|</span>
                <span id="reading-time-meter" class="text-slate-500 font-mono text-xs hidden sm:inline-block">0 Words | 1m Read</span>
            </div>

            <div class="flex items-center gap-2.5 text-xs font-bold">
                <button onclick="EditorialOS.openViewportSandbox()" title="Instant Multi-Viewport Preview" class="btn-studio-secondary h-8 px-3 text-[11px] gap-1.5 font-bold shadow-none border-slate-200">
                    <i class="ph ph-device-mobile text-base text-slate-700"></i> <span>Preview</span>
                </button>
                <button onclick="EditorialOS.openMetadataDrawer()" title="Metadata & SEO Inspector" class="btn-studio-secondary h-8 px-3 text-[11px] gap-1.5 font-bold shadow-none border-slate-200">
                    <i class="ph ph-gear-six text-base text-slate-700"></i> <span>Metadata & SEO</span>
                </button>
                <button onclick="EditorialOS.openPublishModal()" class="btn-studio-primary h-8 px-4 text-[11px] bg-[#C3FF00] text-slate-900 font-black tracking-wider uppercase shadow-xs ml-1">
                    Publish Live
                </button>
            </div>
        </header>

        <!-- IMMACULATE ZERO-CLUTTER WRITING CANVAS (Notion / Ghost Style) -->
        <main id="editorial-canvas-root" class="flex-1 w-full max-w-3xl mx-auto px-6 sm:px-10 py-16 sm:py-24 transition-all duration-200">
            
            <!-- H1 Untitled Placeholder -->
            <div class="group relative">
                <h1 contenteditable="true" class="canvas-title text-3xl sm:text-5xl font-extrabold text-slate-900 focus:outline-none placeholder:text-slate-300 font-sans tracking-tight mb-8 leading-tight" placeholder="Untitled">Untitled</h1>
            </div>

            <!-- Block Editor Container with Slash Commands -->
            <div id="editorial-canvas-blocks" class="editor-canvas space-y-4 text-slate-800 font-normal text-base sm:text-lg leading-relaxed focus:outline-none min-h-[400px]">
                <div class="block-item group relative pl-8 pr-2 py-1 my-1 border-l-2 border-transparent hover:border-slate-200 transition-all">
                    <div class="absolute left-1 top-2.5 opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 z-10">
                        <button title="Block Actions / Grip" onclick="EditorialOS.blockActionMenu(this)" class="text-slate-400 hover:text-slate-900 p-1 cursor-grab font-mono text-sm leading-none">⋮⋮</button>
                    </div>
                    <div contenteditable="true" class="focus:outline-none text-slate-400 focus:text-slate-800 transition-colors">Start writing, or type '/' for commands...</div>
                </div>
            </div>
        </main>
        
        <!-- TELEMETRY FOOTER BAR (Focus Mode Tip) -->
        <footer class="editorial-telemetry-bar h-10 border-t border-slate-100 px-6 flex items-center justify-between text-[11px] font-mono text-slate-400 shrink-0 bg-white">
            <div class="flex items-center gap-4">
                <span>⚡ Type <strong class="text-slate-700">/</strong> for Block Library</span>
                <span>💡 Press <strong class="text-slate-700">Ctrl + Shift + F</strong> for Zen Focus Mode</span>
            </div>
            <div><span>bangjeje.dev Studio Editorial OS V2</span></div>
        </footer>

    </div>

    <!-- Editorial OS Scripts -->
    <script src="../../assets/js/studio-components.js"></script>
    <script src="../../assets/js/editorial-os.js"></script>
</body>
</html>
