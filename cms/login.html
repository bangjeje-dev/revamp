<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | bangjeje.dev CMS</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Shared CMS Styles -->
    <link rel="stylesheet" href="assets/css/cms.css">
</head>
<body class="min-h-screen bg-[#050505] flex items-center justify-center p-6 text-white font-['Outfit'] relative overflow-hidden">
    
    <!-- Background Glow -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#C3FF00]/5 blur-[120px] rounded-full pointer-events-none z-0"></div>

    <div class="max-w-md w-full relative z-10">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-flex items-center gap-2 text-2xl font-bold tracking-tight text-white">
                <div class="w-8 h-8 rounded-lg bg-[#C3FF00] flex items-center justify-center shadow-[0_0_15px_rgba(195,255,0,0.4)]">
                    <div class="w-2.5 h-2.5 bg-[#050505] rounded-full"></div>
                </div>
                bangjeje<span class="text-gray-400 font-normal">.cms</span>
            </a>
            <p class="text-xs font-mono text-gray-400 uppercase tracking-widest mt-2">Restricted Management Area</p>
        </div>

        <!-- Login Card -->
        <div class="glass-panel p-8 md:p-10 border border-white/10 shadow-2xl rounded-2xl">
            <h2 class="text-2xl font-semibold text-white mb-2">Welcome back</h2>
            <p class="text-gray-400 text-sm font-light mb-8">Please sign in to access your content controls.</p>

            <form action="dashboard.html" method="get" class="space-y-6">
                <div>
                    <label for="email" class="block text-xs font-semibold uppercase tracking-widest text-gray-400 mb-2">Admin Email</label>
                    <div class="relative">
                        <i class="ph ph-envelope text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                        <input type="email" id="email" required placeholder="admin@bangjeje.dev" class="input-field pl-12 text-sm w-full">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-widest text-gray-400">Password / Token</label>
                        <a href="#" class="text-xs text-[#C3FF00] hover:underline">Forgot?</a>
                    </div>
                    <div class="relative">
                        <i class="ph ph-lock-key text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 text-lg"></i>
                        <input type="password" id="password" required placeholder="••••••••••••••••" class="input-field pl-12 text-sm w-full">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember" class="rounded border-gray-600 bg-gray-800 text-[#C3FF00] focus:ring-[#C3FF00] h-4 w-4">
                    <label for="remember" class="ml-2 text-xs font-light text-gray-300">Keep me signed in for 30 days</label>
                </div>

                <button type="submit" class="btn-primary w-full py-4 text-sm font-semibold uppercase tracking-widest flex items-center justify-center gap-2 mt-8 text-[#050505] rounded-full shadow-[0_0_20px_rgba(195,255,0,0.25)]">
                    Sign In to Portal <i class="ph ph-arrow-right text-lg"></i>
                </button>
            </form>
        </div>

        <!-- Footer link -->
        <p class="text-center text-xs text-gray-500 font-light mt-8">
            Return to <a href="../index.html" class="text-gray-400 hover:text-white transition-colors underline">public website</a>
        </p>
    </div>
</body>
</html>
